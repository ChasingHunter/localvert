name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # url: intentionally left out — the workers.dev URL isn't known until the
    # first deploy. Set it here once the Worker exists.
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

      # scripts/upload-r2.ts lands in a later slice, alongside the oversized
      # engines it uploads (ADR-0003). Skip cleanly until it exists.
      - name: Upload oversized engines to R2
        if: hashFiles('scripts/upload-r2.ts') != ''
        run: node scripts/upload-r2.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # No wrangler-action: wrangler is already a pinned devDependency via the
      # lockfile, so invoking it directly is one fewer third-party action and
      # one less supply-chain surface for the same result.
      - name: Deploy
        run: pnpm exec wrangler deploy --config infra/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
